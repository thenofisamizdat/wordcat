<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WordCat">
  <defs>
    <filter id="w" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.6"/>
    </filter>
  </defs>
  <g filter="url(#w)">
    <!-- Tile background -->
    <path d="M6 8 L58 6 L60 58 L8 60 Z" fill="#fff8e8" stroke="#1f1408" stroke-width="3" stroke-linejoin="round"/>

    <!-- Ears: taller triangles -->
    <path d="M14 22 L18 4 L26 20 Z" fill="#fff8e8" stroke="#1f1408" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M50 22 L46 4 L38 20 Z" fill="#fff8e8" stroke="#1f1408" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M17 20 L19 10 L23 19 Z" fill="#f1a7b8"/>
    <path d="M47 20 L45 10 L41 19 Z" fill="#f1a7b8"/>

    <!-- Wide rounded cat head -->
    <path d="M12 28
             Q9 38 14 46
             Q20 56 32 56
             Q44 56 50 46
             Q55 38 52 28
             Q46 22 38 23
             Q32 24 26 23
             Q18 22 12 28 Z"
          fill="#fff8e8" stroke="#1f1408" stroke-width="2.2"/>

    <!-- Almond eyes with vertical slit pupils -->
    <path d="M19 35 Q24 31 29 35 Q24 39 19 35 Z" fill="#fff8e8" stroke="#1f1408" stroke-width="1.4"/>
    <path d="M35 35 Q40 31 45 35 Q40 39 35 35 Z" fill="#fff8e8" stroke="#1f1408" stroke-width="1.4"/>
    <ellipse cx="24" cy="35" rx="1.1" ry="3" fill="#1f1408"/>
    <ellipse cx="40" cy="35" rx="1.1" ry="3" fill="#1f1408"/>

    <!-- Pink triangle nose -->
    <path d="M28 42 L36 42 L32 47 Z" fill="#f1a7b8" stroke="#1f1408" stroke-width="1.2"/>
    <!-- Mouth -->
    <path d="M32 47 L32 49" stroke="#1f1408" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M32 49 Q28 52 26 50" stroke="#1f1408" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M32 49 Q36 52 38 50" stroke="#1f1408" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <!-- Whiskers: long curving lines extending past the face -->
    <path d="M3 42 Q12 42 20 44" stroke="#1f1408" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M3 47 Q12 47 20 47" stroke="#1f1408" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M61 42 Q52 42 44 44" stroke="#1f1408" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M61 47 Q52 47 44 47" stroke="#1f1408" stroke-width="1.1" fill="none" stroke-linecap="round"/>

    <!-- Value pip -->
    <text x="55" y="61" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="8" font-weight="800" fill="#1f1408" text-anchor="end">4</text>
  </g>
</svg>
